
name: FreshDrop Java CI-CD

on:
  # Enable automatic deployment after pushing to main when ready.
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  S3_BUCKET: shiva-app-s3-java-jars
  S3_KEY: myapp/app.jar

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Build Spring Boot application
      # Temporarily skip test compilation and execution
      - name: Build application
        run: mvn -B clean package -Dmaven.test.skip=true

      # 4. Prepare executable JAR
      - name: Prepare JAR
        run: |
          JAR_FILE=$(find target -maxdepth 1 \
            -type f -name '*.jar' \
            ! -name '*.jar.original' \
            ! -name '*-plain.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "No executable Spring Boot JAR found!"
            exit 1
          fi

          cp "$JAR_FILE" app.jar

          echo "JAR prepared:"
          ls -lh app.jar

      # 5. Authenticate to AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::810305107532:role/githubActions-role
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # 6. Verify AWS identity
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # 7. Upload JAR to S3
      - name: Upload JAR to S3
        run: |
          aws s3 cp app.jar \
            s3://${S3_BUCKET}/${S3_KEY} \
            --region "$AWS_REGION"

          echo "JAR uploaded successfully!"

      # 8. Prepare deployment script for SSM
      - name: Prepare SSM deployment script
        run: |
          cat > remote-deploy.sh <<'REMOTE'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          REGION="us-east-1"
          BUCKET="shiva-app-s3-java-jars"
          S3_KEY="myapp/app.jar"
          SECRET_NAME="uat/myapp/mysql"

          APP_DIR="/opt/myapp"
          CONFIG_DIR="/etc/myapp"

          echo "Starting FreshDrop deployment..."

          # SSM RunShellScript normally executes as root on Linux.
          if [ "$(id -u)" -ne 0 ]; then
            echo "Deployment script must run as root."
            exit 1
          fi

          # Detect EC2 operating-system service user.
          if id ec2-user >/dev/null 2>&1; then
            SERVICE_USER="ec2-user"
          elif id ubuntu >/dev/null 2>&1; then
            SERVICE_USER="ubuntu"
          else
            echo "Neither ec2-user nor ubuntu exists."
            echo "Configure the correct Linux service user."
            exit 1
          fi

          # Check Java installation.
          JAVA_BIN="$(command -v java || true)"

          if [ -z "$JAVA_BIN" ]; then
            echo "Java is not installed on EC2."
            exit 1
          fi

          java -version

          # Create application and configuration directories.
          install -d -m 755 "$APP_DIR"
          install -d -m 700 "$CONFIG_DIR"

          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT

          # Download new JAR from S3.
          echo "Downloading application JAR..."

          aws s3 cp \
            "s3://${BUCKET}/${S3_KEY}" \
            "$TEMP_DIR/app.jar" \
            --region "$REGION"

          # Retrieve database credentials from Secrets Manager.
          echo "Retrieving database configuration..."

          SECRET_JSON="$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_NAME" \
            --region "$REGION" \
            --query SecretString \
            --output text)"

          # Convert JSON credentials into a protected systemd env file.
          export SECRET_JSON

          python3 - "$TEMP_DIR/myapp.env" <<'PY'
          import json
          import os
          import sys

          output_file = sys.argv[1]
          data = json.loads(os.environ["SECRET_JSON"])

          required = ["db_username", "db_password", "db_url"]

          for key in required:
              if not data.get(key):
                  raise ValueError(f"Missing secret key: {key}")

          values = {
              "DB_USERNAME": data["db_username"],
              "DB_PASSWORD": data["db_password"],
              "DB_URL": data["db_url"]
          }

          def quote_systemd(value):
              value = str(value)

              if "\n" in value or "\r" in value:
                  raise ValueError("Newlines are not supported in DB environment values")

              return '"' + value.replace("\\", "\\\\").replace('"', '\\"') + '"'

          with open(output_file, "w") as f:
              for key, value in values.items():
                  f.write(f"{key}={quote_systemd(value)}\n")

          os.chmod(output_file, 0o600)
          PY

          unset SECRET_JSON

          # Install new application and environment configuration.
          mv "$TEMP_DIR/app.jar" "$APP_DIR/app.jar"
          chmod 644 "$APP_DIR/app.jar"

          install -m 600 \
            "$TEMP_DIR/myapp.env" \
            "$CONFIG_DIR/myapp.env"

          # Create systemd service dynamically.
          echo "Creating systemd service..."

          cat > /etc/systemd/system/myapp.service <<EOF
          [Unit]
          Description=FreshDrop Spring Boot Application
          After=network.target

          [Service]
          Type=simple
          User=${SERVICE_USER}
          WorkingDirectory=${APP_DIR}
          Environment=SPRING_PROFILES_ACTIVE=prod
          EnvironmentFile=${CONFIG_DIR}/myapp.env
          ExecStart=${JAVA_BIN} -jar ${APP_DIR}/app.jar
          Restart=always
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
          EOF

          # Reload systemd and restart application.
          systemctl daemon-reload
          systemctl enable myapp
          systemctl restart myapp

          # Wait for application service to become active.
          echo "Waiting for Spring Boot service..."

          for i in $(seq 1 30); do
            if systemctl is-active --quiet myapp; then
              echo "FreshDrop Spring Boot service is active!"
              systemctl status myapp --no-pager
              exit 0
            fi

            sleep 2
          done

          echo "Application failed to start."

          journalctl -u myapp -n 80 --no-pager || true

          exit 1
          REMOTE

          # Convert the complete script into valid SSM JSON parameters.
          python3 - <<'PY'
          import json

          with open("remote-deploy.sh") as f:
              script = f.read()

          with open("ssm-parameters.json", "w") as f:
              json.dump({"commands": [script]}, f)
          PY

      # 9. Deploy to private EC2 using SSM
      - name: Deploy to private EC2
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          if [ -z "$EC2_INSTANCE_ID" ]; then
            echo "EC2_INSTANCE_ID GitHub variable is missing!"
            exit 1
          fi

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "FreshDrop Spring Boot deployment" \
            --parameters file://ssm-parameters.json \
            --region "$AWS_REGION" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for deployment result.
          for i in $(seq 1 60); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "FreshDrop deployment successful!"
              exit 0
            fi

            if [[ "$STATUS" == "Failed" ||
                  "$STATUS" == "TimedOut" ||
                  "$STATUS" == "Cancelled" ||
                  "$STATUS" == "DeliveryTimedOut" ||
                  "$STATUS" == "ExecutionTimedOut" ||
                  "$STATUS" == "Undeliverable" ||
                  "$STATUS" == "Terminated" ]]; then

              echo "Deployment failed!"

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                --output json || true

              exit 1
            fi

            sleep 5
          done

          echo "Timed out waiting for SSM deployment."
          exit 1
