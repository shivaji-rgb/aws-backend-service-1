
name: FreshDrop Java Spring Boot CI-CD

on:
  workflow_dispatch:

  # Uncomment to deploy automatically on every push to main.
  # push:
  #   branches:
  #     - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  S3_BUCKET: shiva-app-s3-java-jars
  S3_KEY: myapp/app.jar
  SECRET_NAME: uat/myapp/mysql

jobs:

  build-and-deploy:

    name: Build and Deploy Spring Boot Application
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------
      # STEP 1: Checkout source code
      # ------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------
      # STEP 2: Configure Java 21
      # ------------------------------------------------

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pom.xml

      # ------------------------------------------------
      # STEP 3: Build Spring Boot application
      # ------------------------------------------------

      - name: Build Spring Boot JAR
        run: |
          set -euo pipefail

          echo "Java version:"
          java -version

          echo "Maven version:"
          mvn -version

          echo "Building Spring Boot application..."

          mvn -B clean package -Dmaven.test.skip=true

          echo "Build completed successfully."

      # ------------------------------------------------
      # STEP 4: Prepare executable JAR
      # ------------------------------------------------

      - name: Prepare application JAR
        run: |
          set -euo pipefail

          mkdir -p deployment

          mapfile -t JARS < <(
            find target \
              -maxdepth 1 \
              -type f \
              -name '*.jar' \
              ! -name '*.jar.original' \
              ! -name '*-plain.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              ! -name '*-tests.jar'
          )

          if [ "${#JARS[@]}" -ne 1 ]; then
            echo "Expected exactly one executable JAR."
            echo "Found ${#JARS[@]} candidate JAR files."
            ls -lh target/*.jar || true
            exit 1
          fi

          cp "${JARS[0]}" deployment/app.jar

          echo "Prepared executable JAR:"
          ls -lh deployment/app.jar

      # ------------------------------------------------
      # STEP 5: Authenticate AWS using GitHub OIDC
      # ------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::810305107532:role/githubActions-role
          aws-region: us-east-1
          audience: sts.amazonaws.com

      # ------------------------------------------------
      # STEP 6: Verify AWS identity
      # ------------------------------------------------

      - name: Verify AWS authentication
        run: |
          set -euo pipefail

          aws sts get-caller-identity

      # ------------------------------------------------
      # STEP 7: Upload JAR to S3
      # ------------------------------------------------

      - name: Upload JAR to S3
        run: |
          set -euo pipefail

          echo "Uploading application JAR to S3..."

          aws s3 cp \
            deployment/app.jar \
            "s3://${S3_BUCKET}/${S3_KEY}" \
            --region "$AWS_REGION"

          echo "S3 upload completed."

      # ------------------------------------------------
      # STEP 8: Create remote deployment script
      # ------------------------------------------------

      - name: Create EC2 deployment script
        run: |
          cat > remote-deploy.sh <<'REMOTE_SCRIPT'
          #!/bin/bash

          set -euo pipefail

          AWS_REGION="us-east-1"
          S3_BUCKET="shiva-app-s3-java-jars"
          S3_KEY="myapp/app.jar"
          SECRET_NAME="uat/myapp/mysql"

          APP_DIR="/opt/myapp"
          CONFIG_DIR="/etc/myapp"
          APP_JAR="${APP_DIR}/app.jar"

          echo "Starting FreshDrop deployment..."

          # --------------------------------------------
          # STEP 8.1: Detect Linux distribution
          # --------------------------------------------

          source /etc/os-release

          echo "Operating system: ${PRETTY_NAME:-$ID}"

          # --------------------------------------------
          # STEP 8.2: Install required packages
          # --------------------------------------------

          if ! command -v java >/dev/null 2>&1 ||
             ! command -v aws >/dev/null 2>&1 ||
             ! command -v python3 >/dev/null 2>&1; then

            echo "Installing missing dependencies..."

            case "$ID" in

              amzn)
                if command -v dnf >/dev/null 2>&1; then
                  dnf install -y \
                    java-21-amazon-corretto-headless \
                    awscli \
                    python3
                else
                  yum install -y \
                    java-21-amazon-corretto-headless \
                    awscli \
                    python3
                fi
                ;;

              ubuntu|debian)
                apt-get update

                apt-get install -y \
                  openjdk-21-jre-headless \
                  awscli \
                  python3
                ;;

              *)
                echo "Unsupported Linux distribution: $ID"
                exit 1
                ;;
            esac

          fi

          # --------------------------------------------
          # STEP 8.3: Verify Java 21
          # --------------------------------------------

          if ! command -v java >/dev/null 2>&1; then
            echo "Java installation failed."
            exit 1
          fi

          echo "Installed Java version:"
          java -version

          JAVA_VERSION=$(
            java -XshowSettings:properties -version 2>&1 |
            awk -F'= ' '/java.specification.version/ {print $2; exit}'
          )

          if [ "$JAVA_VERSION" != "21" ]; then
            echo "Java 21 is required. Found: $JAVA_VERSION"
            exit 1
          fi

          echo "Java 21 verification successful."

          # --------------------------------------------
          # STEP 8.4: Verify AWS CLI and Python
          # --------------------------------------------

          command -v aws
          command -v python3

          aws --version

          # --------------------------------------------
          # STEP 8.5: Create application directories
          # --------------------------------------------

          mkdir -p "$APP_DIR"
          mkdir -p "$CONFIG_DIR"

          # Create dedicated Linux application user.

          if ! id myapp >/dev/null 2>&1; then

            NOLOGIN=$(command -v nologin || echo /sbin/nologin)

            useradd \
              --system \
              --home-dir "$APP_DIR" \
              --shell "$NOLOGIN" \
              myapp

          fi

          # --------------------------------------------
          # STEP 8.6: Download JAR from S3
          # --------------------------------------------

          echo "Downloading application JAR from S3..."

          TEMP_JAR="${APP_DIR}/app.jar.tmp"

          aws s3 cp \
            "s3://${S3_BUCKET}/${S3_KEY}" \
            "$TEMP_JAR" \
            --region "$AWS_REGION"

          mv "$TEMP_JAR" "$APP_JAR"

          chown myapp:myapp "$APP_JAR"
          chmod 644 "$APP_JAR"

          echo "Application JAR downloaded."

          # --------------------------------------------
          # STEP 8.7: Retrieve DB credentials
          # from AWS Secrets Manager
          # --------------------------------------------

          echo "Retrieving database configuration..."

          SECRET_JSON=$(
            aws secretsmanager get-secret-value \
              --secret-id "$SECRET_NAME" \
              --query SecretString \
              --output text \
              --region "$AWS_REGION"
          )

          if [ -z "$SECRET_JSON" ] || [ "$SECRET_JSON" = "None" ]; then
            echo "Could not retrieve database secret."
            exit 1
          fi

          export SECRET_JSON

          # --------------------------------------------
          # STEP 8.8: Create protected environment file
          # --------------------------------------------

          python3 - <<'PYTHON_SCRIPT'
          import json
          import os

          secret = json.loads(os.environ["SECRET_JSON"])

          required = [
              "db_username",
              "db_password",
              "db_url"
          ]

          for key in required:
              if key not in secret or not isinstance(secret[key], str):
                  raise ValueError(
                      f"Missing or invalid secret key: {key}"
                  )

              if "\n" in secret[key] or "\r" in secret[key]:
                  raise ValueError(
                      f"Newlines are not allowed in {key}"
                  )

          def systemd_quote(value):
              value = value.replace("\\", "\\\\")
              value = value.replace('"', '\\"')
              return f'"{value}"'

          env_content = (
              f"DB_USERNAME={systemd_quote(secret['db_username'])}\n"
              f"DB_PASSWORD={systemd_quote(secret['db_password'])}\n"
              f"DB_URL={systemd_quote(secret['db_url'])}\n"
          )

          with open("/etc/myapp/myapp.env", "w") as file:
              file.write(env_content)

          os.chmod("/etc/myapp/myapp.env", 0o600)

          print("Database environment configuration created.")
          PYTHON_SCRIPT

          unset SECRET_JSON

          # --------------------------------------------
          # STEP 8.9: Create systemd service
          # --------------------------------------------

          JAVA_BIN=$(command -v java)

          cat > /etc/systemd/system/myapp.service <<SERVICE_FILE
          [Unit]
          Description=FreshDrop Spring Boot Application
          After=network.target

          [Service]
          Type=simple
          User=myapp
          WorkingDirectory=/opt/myapp

          Environment="SPRING_PROFILES_ACTIVE=prod"
          EnvironmentFile=/etc/myapp/myapp.env

          ExecStart=${JAVA_BIN} -jar /opt/myapp/app.jar

          Restart=on-failure
          RestartSec=10
          SuccessExitStatus=143
          TimeoutStartSec=120

          NoNewPrivileges=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
          SERVICE_FILE

          chmod 644 /etc/systemd/system/myapp.service

          # --------------------------------------------
          # STEP 8.10: Start application
          # --------------------------------------------

          echo "Starting Spring Boot application..."

          systemctl daemon-reload

          systemctl enable myapp

          systemctl restart myapp

          # --------------------------------------------
          # STEP 8.11: Verify service
          # --------------------------------------------

          for i in $(seq 1 30); do

            if systemctl is-active --quiet myapp; then
              echo "FreshDrop application is running!"
              break
            fi

            echo "Waiting for application startup..."
            sleep 2

          done

          if ! systemctl is-active --quiet myapp; then

            echo "Application failed to start."

            systemctl status myapp --no-pager || true

            journalctl \
              -u myapp \
              -n 100 \
              --no-pager || true

            exit 1

          fi

          echo "----------------------------------"
          echo "FreshDrop deployment completed."
          echo "Application port: 9050"
          echo "Systemd service: myapp"
          echo "----------------------------------"

          systemctl status myapp --no-pager

          REMOTE_SCRIPT

      # ------------------------------------------------
      # STEP 9: Convert script into SSM JSON parameters
      # ------------------------------------------------

      - name: Prepare SSM parameters
        run: |
          python3 - <<'PYTHON_SCRIPT'
          import json

          with open("remote-deploy.sh", "r") as file:
              script = file.read()

          with open("ssm-parameters.json", "w") as file:
              json.dump(
                  {"commands": [script]},
                  file
              )
          PYTHON_SCRIPT

      # ------------------------------------------------
      # STEP 10: Deploy through AWS SSM
      # ------------------------------------------------

      - name: Deploy to private EC2
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

        run: |
          set -euo pipefail

          if [ -z "$EC2_INSTANCE_ID" ]; then
            echo "EC2_INSTANCE_ID GitHub variable is missing!"
            exit 1
          fi

          echo "Sending deployment command to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "FreshDrop Spring Boot deployment" \
            --parameters file://ssm-parameters.json \
            --region "$AWS_REGION" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # ------------------------------------------
          # Wait for SSM deployment result
          # ------------------------------------------

          for i in $(seq 1 60); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then

              echo "Deployment successful!"

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query 'StandardOutputContent' \
                --output text

              exit 0

            fi

            if [[ "$STATUS" == "Failed" ||
                  "$STATUS" == "TimedOut" ||
                  "$STATUS" == "Cancelled" ||
                  "$STATUS" == "DeliveryTimedOut" ||
                  "$STATUS" == "ExecutionTimedOut" ||
                  "$STATUS" == "Undeliverable" ||
                  "$STATUS" == "Terminated" ]]; then

              echo "Deployment failed!"

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                --output json || true

              exit 1

            fi

            sleep 5

          done

          echo "Timed out waiting for SSM deployment."
          exit 1
