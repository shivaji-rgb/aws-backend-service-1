
name: FreshDrop Java CI-CD

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  S3_BUCKET: shiva-app-s3-java-jars
  S3_KEY: myapp/app.jar

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Build Spring Boot application
      # Skip test compilation and execution temporarily
      - name: Build application
        run: mvn -B clean package -Dmaven.test.skip=true

      # 4. Prepare executable JAR
      - name: Prepare JAR
        run: |
          JAR_FILE=$(find target -maxdepth 1 \
            -type f -name '*.jar' \
            ! -name '*.jar.original' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "No executable JAR found!"
            exit 1
          fi

          cp "$JAR_FILE" app.jar
          echo "Generated executable JAR:"
          ls -lh app.jar

      # 5. Authenticate to AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::810305107532:role/githubActions-role
          aws-region: ${{ env.AWS_REGION }}

      # 6. Verify AWS identity
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # 7. Upload JAR to S3
      - name: Upload JAR to S3
        run: |
          aws s3 cp app.jar s3://${S3_BUCKET}/${S3_KEY}

      # 8. Deploy to private EC2 using SSM
      - name: Deploy to private EC2
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          if [ -z "$EC2_INSTANCE_ID" ]; then
            echo "EC2_INSTANCE_ID GitHub variable is missing"
            exit 1
          fi

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo /opt/myapp/deploy.sh"]' \
            --region "$AWS_REGION" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for deployment to finish
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment successful!"
              exit 0
            fi

            if [[ "$STATUS" == "Failed" ||
                  "$STATUS" == "TimedOut" ||
                  "$STATUS" == "Cancelled" ]]; then

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query 'StandardErrorContent' \
                --output text

              exit 1
            fi

            sleep 5
          done

          echo "Deployment timed out waiting for SSM."
          exit 1
